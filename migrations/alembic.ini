# Alembic config for the shipping gateway.
# Run from the repository root:
#   alembic -c migrations/alembic.ini -x db_url=sqlite:///./local.db upgrade head
# or set DATABASE_URL. There is intentionally NO default URL: migrations never
# run against a database nobody named explicitly.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
