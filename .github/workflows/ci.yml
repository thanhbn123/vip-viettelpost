name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint:
    # Pinned linter (D-034). Config in pyproject.toml [tool.ruff.lint].
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9  # same pin as requirements-dev.txt
      - run: ruff check app tests migrations scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  postgres:
    # Throwaway PostgreSQL 16 service container. No shared/staging/production database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: shipping_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shipping_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_POSTGRES: "1"
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci-only-throwaway@localhost:5432/shipping_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Test suite on SQLite and PostgreSQL
        run: pytest -q
      - name: Alembic CLI upgrade / downgrade / upgrade on PostgreSQL
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ["TEST_POSTGRES_URL"], isolation_level="AUTOCOMMIT")
          with e.connect() as c:
              c.execute(text("DROP SCHEMA IF EXISTS public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
          PY
          alembic -c migrations/alembic.ini -x db_url="$TEST_POSTGRES_URL" upgrade head
          alembic -c migrations/alembic.ini -x db_url="$TEST_POSTGRES_URL" current
          alembic -c migrations/alembic.ini -x db_url="$TEST_POSTGRES_URL" downgrade base
          alembic -c migrations/alembic.ini -x db_url="$TEST_POSTGRES_URL" upgrade head

  image:
    # Builds the runtime image and checks its hardening (G12). Never pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plant decoy secrets that must NOT reach the image (root and nested)
        run: |
          echo "DECOY_SECRET=must-not-be-in-image" > .env
          echo "DECOY_SECRET=must-not-be-in-image" > app/.env
          echo "must-not-be-in-image" > migrations/decoy.db
      - run: docker build -t vip-shipping-gateway:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm vip-shipping-gateway:ci id -u)" = "10001"
      - name: No local secrets, tests or VCS data inside
        run: |
          set -euo pipefail
          listing="$(docker run --rm vip-shipping-gateway:ci sh -c 'ls -a /app')"
          echo "$listing"
          test -z "$(printf '%s\n' "$listing" | grep -xE '\.env|\.git|tests|\.venv' || true)"
          # grep exit 1 = nothing found (good); >1 = grep error, which must fail the step.
          found="$(docker run --rm vip-shipping-gateway:ci sh -c 'grep -rl must-not-be-in-image /app; rc=$?; [ "$rc" -le 1 ] || exit "$rc"')"
          test -z "$found"
      - name: App imports and timezone data is available
        run: >
          docker run --rm -e VTP_WEBHOOK_TIMEZONE=Asia/Ho_Chi_Minh vip-shipping-gateway:ci
          python -c "import app.main; from zoneinfo import ZoneInfo; ZoneInfo('Asia/Ho_Chi_Minh'); print('ok')"

  rehearsal:
    # Rehearses the staging pipeline mechanics on EPHEMERAL containers (CR-STG-001).
    # Verdict is REHEARSAL_PASS at best: this is never staging evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Rehearse image -> migrate -> start -> acceptance (no preflight, no target)
        env:
          GIT_SHA: ${{ github.sha }}
          REHEARSAL_DB_URL: postgresql+psycopg://ci:ci-only-throwaway@127.0.0.1:5432/rehearsal
        run: bash scripts/staging/rehearsal.sh
      - name: Rehearsal evidence
        if: always()
        run: cat rehearsal-evidence.json >> "$GITHUB_STEP_SUMMARY" || true
